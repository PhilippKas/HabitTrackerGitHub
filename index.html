<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habit Tracker">
<title>Habit Tracker</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: light;
    --bg: #f2f2f7;
    --surface: #ffffff;
    --surface-2: #f0f0f5;          /* tonal fills inside cards */
    --text: #1c1c1e;
    --text-2: #6c6c72;
    --text-3: #a1a1a8;
    --separator: rgba(60,60,67,.12);
    --accent: #5e5ce6;
    --accent-soft: rgba(94,92,230,.12);
    --on-accent: #ffffff;
    --flame: #f28c00;
    --danger: #ff3b30;
    --danger-soft: rgba(255,59,48,.1);
    --seg-active: #ffffff;
    --overlay: rgba(0,0,0,.28);
    --toast-bg: rgba(28,28,30,.9);
    --toast-text: #ffffff;
    --radius-lg: 22px;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --shadow-lg: 0 16px 40px rgba(0,0,0,.18);
    --ease: cubic-bezier(.2,.8,.2,1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ── Dark Mode ── */
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --text: #f5f5f7;
    --text-2: #98989f;
    --text-3: #636366;
    --separator: rgba(84,84,88,.5);
    --accent: #7d7aff;
    --accent-soft: rgba(125,122,255,.2);
    --flame: #ff9f0a;
    --danger: #ff453a;
    --danger-soft: rgba(255,69,58,.16);
    --seg-active: #636366;
    --overlay: rgba(0,0,0,.6);
    --toast-bg: rgba(242,242,247,.94);
    --toast-text: #1c1c1e;
    --shadow: none;
    --shadow-lg: 0 16px 40px rgba(0,0,0,.6);
  }

  [hidden] { display: none !important; }
  html { height: 100%; background: var(--bg); }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

  /* Line icons */
  .i {
    width: 20px; height: 20px; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .i.solid { fill: currentColor; stroke: none; }

  .app {
    width: 100%;
    max-width: 480px;
    padding: 8px 16px 48px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 4px 0;
  }
  .header-date {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--text-2);
  }
  .header h1 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -.025em;
    line-height: 1.15;
  }
  .header-actions { display: flex; gap: 8px; padding-bottom: 4px; }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s var(--ease), background .15s;
    flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(.9); background: var(--surface-2); }

  /* ── Today summary ── */
  .summary {
    display: flex;
    flex-direction: column;
    padding: 14px 18px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }
  .summary-row { display: flex; align-items: center; gap: 14px; }
  .ring { width: 46px; height: 46px; flex-shrink: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5.5; }
  .ring .track { stroke: var(--surface-2); }
  .ring .ring-bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s var(--ease); }
  .summary-text { min-width: 0; }
  .summary-text strong { display: block; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .summary-text span { font-size: 13px; color: var(--text-2); }

  /* ── Add Habit ── */
  .add-form { position: relative; display: flex; }
  .add-form input {
    flex: 1;
    min-width: 0;
    height: 52px;
    padding: 0 60px 0 18px;
    font-size: 16px;
    font-family: var(--font);
    border: none;
    border-radius: 16px;
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
    outline: none;
    transition: box-shadow .15s;
    -webkit-user-select: text;
    user-select: text;
  }
  .add-form input::placeholder { color: var(--text-3); }
  .add-form input:focus { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  .add-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--on-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s var(--ease);
  }
  .add-btn:active { transform: scale(.9); }
  .add-btn .i { stroke-width: 2.6; }

  /* ── Habits List ── */
  .habits-list { display: flex; flex-direction: column; gap: 12px; }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-2);
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }
  .empty-icon {
    width: 56px; height: 56px; margin: 0 auto 14px;
    border-radius: 18px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .empty-icon .i { width: 26px; height: 26px; }
  .empty-state strong { display: block; font-size: 17px; color: var(--text); margin-bottom: 4px; }
  .empty-state p { font-size: 15px; line-height: 1.45; }

  /* ── Habit Card ── */
  .habit-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 12px 14px 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: box-shadow .2s, transform .2s var(--ease);
  }
  .habit-card.dragging {
    box-shadow: var(--shadow-lg);
    transform: scale(1.02);
    z-index: 50;
    position: relative;
  }
  .habit-row { display: flex; align-items: center; gap: 4px; }
  .drag-handle {
    cursor: grab;
    touch-action: none;
    color: var(--text-3);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    min-height: 44px;
    margin-left: -6px;
    flex-shrink: 0;
  }
  .drag-handle .i { width: 18px; height: 18px; fill: currentColor; stroke: none; }
  .drag-handle:active { cursor: grabbing; }
  .habit-info { flex: 1; min-width: 0; }
  .habit-name {
    display: block;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .habit-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
  }
  .habit-streak {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 13px;
    font-weight: 600;
    color: var(--flame);
  }
  .habit-streak .i { width: 14px; height: 14px; fill: currentColor; stroke: none; }
  .habit-streak.zero { color: var(--text-3); font-weight: 500; }

  .more-btn {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .more-btn[aria-expanded="true"] { background: var(--surface-2); color: var(--text); }

  .check-btn {
    width: 46px;
    height: 46px;
    margin-left: 4px;
    border: none;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text-3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .2s, color .2s, transform .15s var(--ease);
  }
  .check-btn .i { width: 24px; height: 24px; stroke-width: 2.6; }
  .check-btn.done { background: var(--accent); color: var(--on-accent); }
  .check-btn:active { transform: scale(.9); }

  .pop { animation: pop .38s var(--ease); }
  @keyframes pop {
    0% { transform: scale(.85); }
    45% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  /* ── Week strip ── */
  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-dot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0;
    border: none;
    background: none;
    min-width: 0;
  }
  .day-dot .dl {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .day-dot .dn {
    width: 100%;
    max-width: 42px;
    aspect-ratio: 1;
    border-radius: 12px;
    background: var(--surface-2);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 600;
    transition: background .15s, color .15s, transform .15s var(--ease);
  }
  .day-dot:active .dn { transform: scale(.9); }
  .day-dot.done .dn { background: var(--accent); color: var(--on-accent); }
  .day-dot.today .dl { color: var(--accent); }
  .day-dot.today:not(.done) .dn { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); }

  /* ── Month view ── */
  .month-nav { display: flex; align-items: center; justify-content: space-between; }
  .month-nav-label { font-size: 15px; font-weight: 700; }
  .month-nav-btn {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s var(--ease);
  }
  .month-nav-btn:active { transform: scale(.9); }
  .month-nav-btn .i { width: 18px; height: 18px; }
  .calendar { width: 100%; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-head {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--text-3);
    padding-bottom: 2px;
  }
  .cal-cell {
    aspect-ratio: 1;
    border: none;
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    transition: background .15s, color .15s, transform .15s var(--ease);
  }
  .cal-cell:active { transform: scale(.9); }
  .cal-cell.done { background: var(--accent); color: var(--on-accent); }
  .cal-cell.today:not(.done) { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); }
  .cal-cell.empty { background: transparent; pointer-events: none; }

  /* ── Card actions (behind the ⋯ button) ── */
  .card-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    row-gap: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--separator);
  }
  .card-actions .spacer { flex: 1; }
  .view-toggle {
    display: inline-flex;
    padding: 2px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
  }
  .view-toggle button {
    min-height: 32px;
    padding: 0 12px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 600;
    transition: background .15s, color .15s;
  }
  .view-toggle button.active {
    background: var(--seg-active);
    color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .reorder-btns { display: flex; gap: 6px; }
  .mini-btn {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .mini-btn:active { transform: scale(.92); }
  .mini-btn .i { width: 18px; height: 18px; }
  .mini-btn.danger { background: var(--danger-soft); color: var(--danger); }

  /* ── Buttons (dialogs, backup card) ── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 50px;
    padding: 0 20px;
    border: none;
    border-radius: var(--radius);
    font-size: 17px;
    font-weight: 600;
    font-family: var(--font);
    white-space: nowrap;
    transition: transform .15s var(--ease), opacity .15s;
  }
  .btn:active { transform: scale(.97); opacity: .85; }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-ghost { background: var(--surface-2); color: var(--text); }
  .btn-tonal {
    min-height: 36px;
    padding: 0 14px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* ── Backup card ── */
  .backup-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px 14px 16px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }
  .backup-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .backup-text { flex: 1; min-width: 0; }
  .backup-text strong { display: block; font-size: 15px; font-weight: 600; }
  .backup-text span { font-size: 13px; color: var(--text-2); }
  .backup-text span.warn { color: var(--danger); font-weight: 600; }
  .backup-actions { display: flex; gap: 6px; flex-shrink: 0; }
  #importFile { display: none; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: calc(28px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(16px) scale(.96);
    max-width: calc(100% - 32px);
    width: max-content;
    background: var(--toast-bg);
    color: var(--toast-text);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    box-shadow: var(--shadow-lg);
    z-index: 150; /* below open sheets so it never covers their buttons */
    opacity: 0;
    transition: transform .3s var(--ease), opacity .3s var(--ease);
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }

  /* ── Bottom sheets (confirm + settings) ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .dialog {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-radius: 26px 26px 0 0;
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow: var(--shadow-lg);
    text-align: center;
    transform: translateY(100%);
    transition: transform .32s var(--ease);
  }
  .overlay.open .dialog { transform: none; }
  .dialog::before {
    content: '';
    display: block;
    width: 36px;
    height: 5px;
    margin: 0 auto 16px;
    border-radius: 3px;
    background: var(--separator);
  }
  .dialog h3 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 6px; }
  .dialog p { font-size: 15px; line-height: 1.45; color: var(--text-2); margin-bottom: 22px; }
  .dialog .btn-row { display: flex; flex-direction: column-reverse; gap: 10px; }
  .dialog .btn-row .btn { width: 100%; }

  /* ── Settings sheet ── */
  .settings-dialog { text-align: left; }
  .settings-dialog h3 { text-align: center; margin-bottom: 14px; }
  .setting-group {
    background: var(--surface-2);
    border-radius: var(--radius);
    padding: 0 16px;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 52px;
    padding: 10px 0;
  }
  .setting-row + .setting-row { border-top: 1px solid var(--separator); }
  .setting-label { font-size: 16px; font-weight: 500; color: var(--text); }
  .setting-label small {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-2);
    line-height: 1.35;
    margin-top: 2px;
    max-width: 200px;
  }
  .setting-value { font-size: 15px; color: var(--text-2); text-align: right; }
  .setting-value.warn { color: var(--danger); font-weight: 600; }
  .settings-dialog > .btn { width: 100%; margin-top: 12px; }

  /* ── Privacy Shield (hide button) ── */
  .shield {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .shield.show { display: flex; }
  .shield-hint {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-2);
    opacity: .4;
    pointer-events: none;
  }
  .shield-hint .i { width: 28px; height: 28px; }


  /* ── Toggle switch ── */
  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute;
    inset: 0;
    background: var(--separator);
    border-radius: 31px;
    transition: background .2s;
    cursor: pointer;
  }
  [data-theme="dark"] .switch .slider { background: #39393d; }
  .switch .slider::before {
    content: '';
    position: absolute;
    width: 27px;
    height: 27px;
    left: 2px;
    top: 2px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    transition: transform .25s var(--ease);
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  .setting-input {
    width: 150px;
    height: 36px;
    padding: 0 12px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    font-family: var(--font);
    text-align: right;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }
  .setting-input:focus { box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ── Game layer (cyberpunk RPG) — flat neon, angular cut corners ── */
  :root {
    --neon-cyan: #00e5f2;
    --neon-magenta: #ff2a6d;
    --neon-yellow: #fcee0a;
    --neon-ink: #0a0a12;
    --neon-cyan-text: #008a94;
    --neon-magenta-text: #d4134f;
    --cut: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  [data-theme="dark"] {
    --neon-cyan-text: #00e5f2;
    --neon-magenta-text: #ff4f86;
    --neon-ink: #000000;
  }
  body.no-game .game { display: none !important; }

  .char {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    margin-top: 14px;
    padding: 14px 0 0;
    border: none;
    border-top: 1px solid var(--separator);
    background: none;
    text-align: left;
  }
  .char-avatar {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    background: var(--neon-ink);
    color: var(--neon-cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  }
  .char-avatar .i { width: 24px; height: 24px; }
  .char-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .char-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .char-head strong { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .char-lvl {
    flex-shrink: 0;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .08em;
    background: var(--neon-yellow);
    color: #0a0a12;
    clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
  }
  .char-meta {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-2);
  }
  .char-chev { color: var(--text-3); }
  .meter { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .05em; }
  .meter-label { width: 18px; color: var(--text-3); }
  .bar { flex: 1; display: block; height: 6px; background: var(--surface-2); overflow: hidden; }
  .fill { display: block; height: 100%; transition: width .5s var(--ease); }
  .fill.xp { background: var(--neon-cyan); }
  .fill.hp { background: var(--neon-magenta); }
  .meter-val { min-width: 62px; text-align: right; color: var(--text-2); }
  .meter-val.warn { color: var(--neon-magenta-text); }

  /* Habit card extras */
  .best { font-size: 12px; font-weight: 600; color: var(--text-3); }
  .pb, .stat-chip {
    padding: 1px 5px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .06em;
    flex-shrink: 0;
  }
  .pb { background: var(--neon-magenta); color: #fff; }
  .stat-chip { box-shadow: inset 0 0 0 1.5px currentColor; color: var(--neon-cyan-text); }
  .stat-picker { display: flex; align-items: center; gap: 4px; width: 100%; }
  .stat-picker-label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); margin-right: 4px; }
  .stat-picker button {
    flex: 1;
    min-height: 30px;
    padding: 0;
    border: none;
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .04em;
  }
  .stat-picker button.active { background: var(--neon-ink); color: var(--neon-cyan); }

  /* Character sheet */
  .char-sheet { text-align: left; max-height: 90vh; max-height: 90dvh; display: flex; flex-direction: column; }
  .sheet-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .sheet-head > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .sheet-head strong { font-size: 20px; font-weight: 800; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-head .char-avatar { width: 56px; height: 56px; }
  .sheet-head .char-lvl { font-size: 13px; padding: 4px 9px; }
  .sheet-tabs { display: flex; width: 100%; }
  .sheet-tabs button { flex: 1; }
  .sheet-body { flex: 1; overflow-y: auto; margin: 16px -20px 4px; padding: 0 20px 4px; -webkit-overflow-scrolling: touch; }
  .sheet-h { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); margin: 18px 0 10px; }
  .sheet-note { font-size: 13px; line-height: 1.45; color: var(--text-2); margin-top: 10px; }
  .hp-warn { color: var(--neon-magenta-text); font-weight: 700; }
  .meters { display: flex; flex-direction: column; gap: 8px; }
  .meters .meter-label { width: 22px; }
  .attrs { display: flex; flex-direction: column; gap: 8px; }
  .attr { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--radius); }
  .attr-code {
    width: 50px;
    padding: 5px 0;
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .06em;
    background: var(--surface);
    color: var(--text-2);
    clip-path: var(--cut);
    flex-shrink: 0;
  }
  .attr.top .attr-code { background: var(--neon-ink); color: var(--neon-cyan); }
  .attr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .attr-main strong { font-size: 14px; font-weight: 600; }
  .attr-main strong em { font-style: normal; font-weight: 500; color: var(--text-3); }
  .attr-main > span:not(.bar) { font-size: 12px; color: var(--text-2); }
  .attr-main .bar { flex: none; height: 4px; margin-top: 3px; background: var(--surface); }
  .attr-score { font-size: 24px; font-weight: 800; min-width: 44px; text-align: right; }
  .attr-score em { display: block; font-style: normal; font-size: 11px; font-weight: 700; color: var(--text-3); }
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 12px 6px 10px;
    text-align: center;
    background: var(--surface-2);
    border-radius: var(--radius);
  }
  .badge-icon {
    width: 46px;
    height: 46px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    color: var(--text-3);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  .badge.on .badge-icon { background: var(--neon-ink); color: var(--neon-yellow); }
  .badge strong { font-size: 12px; font-weight: 700; line-height: 1.2; }
  .badge span { font-size: 11px; line-height: 1.25; color: var(--text-2); }
  .badge em { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); margin-top: 2px; }
  .badge.on em { color: var(--neon-cyan-text); }
  .badge:not(.on) strong, .badge:not(.on) span { opacity: .55; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tile { padding: 12px 14px; background: var(--surface-2); border-radius: var(--radius); }
  .tile strong { display: block; font-size: 24px; font-weight: 800; }
  .tile span { font-size: 12px; color: var(--text-2); }
  .heatmap { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
  .hm { aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); }
  .hm.future { background: transparent; }
  .hm.l1, .hm.l2, .hm.l3, .hm.l4 { background: var(--accent); }
  .hm.l1 { opacity: .3; } .hm.l2 { opacity: .55; } .hm.l3 { opacity: .8; }
  .records { display: flex; flex-direction: column; background: var(--surface-2); border-radius: var(--radius); padding: 0 14px; }
  .rec { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .rec + .rec { border-top: 1px solid var(--separator); }
  .rec span { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec em { font-style: normal; font-size: 12px; color: var(--text-3); }
  .rec strong { font-size: 17px; font-weight: 800; min-width: 28px; text-align: right; }


  /* Evolving avatar (avatar.js) */
  .av { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
  .av > svg { display: block; width: 100%; height: 100%; }
  .av .av-pet { position: absolute; right: -7px; bottom: -7px; width: 46%; height: 46%; }
  .av .av-pet svg { display: block; width: 100%; height: 100%; }
  .sheet-head .av { width: 104px; height: 104px; }
  .sheet-head .av .av-pet { right: -9px; bottom: -9px; }
  .sheet-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .sheet-line { font-size: 13px; color: var(--text-2); }
  .sheet-line b { color: var(--text); font-weight: 600; }
  .next-up { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--radius); }
  .next-up .av { width: 46px; height: 46px; opacity: .45; }
  .next-up div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .next-up strong { font-size: 14px; font-weight: 700; }
  .next-up span { font-size: 12px; color: var(--text-2); }
  .lock-tag { font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 2px 6px; background: var(--neon-ink); color: var(--neon-yellow); clip-path: var(--cut); flex-shrink: 0; }
  .ups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .up { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: var(--surface-2); color: var(--text-2); }
  .up b { color: var(--neon-cyan-text); font-weight: 800; margin-right: 4px; }
  .look-preview { display: flex; justify-content: center; padding: 6px 0 4px; }
  .look-preview .av { width: 132px; height: 132px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    width: 40px; height: 40px; padding: 0;
    border: none; border-radius: 50%;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.12);
  }
  .swatch.on { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent); }
  .look-name { width: 100%; text-align: left; background: var(--surface-2); }
  .levelup .av { width: 150px; height: 150px; margin-bottom: 10px; }
  .levelup .ups { justify-content: center; max-width: 320px; }
  .levelup .up { background: rgba(255,255,255,.1); color: #fff; }
  .levelup .up b { color: var(--neon-yellow); }

  /* Celebrations */
  .xp-float {
    position: fixed;
    z-index: 400;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .04em;
    color: var(--neon-cyan-text);
    pointer-events: none;
    white-space: nowrap;
    animation: xp-float .95s var(--ease) forwards;
  }
  .xp-float.crit { color: var(--neon-magenta-text); font-size: 17px; }
  @keyframes xp-float {
    from { opacity: 0; transform: translate(-50%, 4px); }
    20% { opacity: 1; }
    to { opacity: 0; transform: translate(-50%, -46px); }
  }
  .levelup {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(10,10,18,.9);
    cursor: pointer;
    animation: lu-in .28s var(--ease);
    transition: opacity .3s;
  }
  .levelup.out { opacity: 0; }
  .levelup span { font-size: 15px; font-weight: 800; letter-spacing: .32em; color: var(--neon-cyan); }
  .levelup strong { font-size: 128px; font-weight: 900; line-height: 1; color: var(--neon-yellow); text-shadow: -5px 0 var(--neon-cyan), 5px 0 var(--neon-magenta); }
  .levelup em { font-style: normal; font-size: 16px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #fff; }
  @keyframes lu-in { from { opacity: 0; transform: scale(1.08); } to { opacity: 1; transform: none; } }
  .confetti {
    position: fixed;
    top: -16px;
    z-index: 600;
    width: 8px;
    height: 14px;
    pointer-events: none;
    animation: fall var(--d) cubic-bezier(.3,.6,.6,1) var(--delay) forwards;
  }
  @keyframes fall { to { transform: translate(var(--dx), 108vh) rotate(var(--r)); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div>
      <span class="header-date" id="headerDate"></span>
      <h1>Habits</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
      <button class="icon-btn" id="hideBtn" aria-label="Hide app content" title="Hide" data-icon="eyeOff"></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" data-icon="sliders"></button>
    </div>
  </header>

  <section class="summary" id="summary" hidden>
    <div class="summary-row">
      <svg class="ring" viewBox="0 0 46 46" aria-hidden="true">
        <circle class="track" cx="23" cy="23" r="19"/>
        <circle class="ring-bar" id="ringBar" cx="23" cy="23" r="19" stroke-dasharray="119.38" stroke-dashoffset="119.38"/>
      </svg>
      <div class="summary-text">
        <strong id="summaryTitle"></strong>
        <span id="summarySub"></span>
      </div>
    </div>
    <button class="game char" id="charBlock" aria-label="Open character sheet">
      <span class="char-avatar" id="charAvatar"></span>
      <span class="char-main">
        <span class="char-head"><strong id="charName"></strong><span class="char-lvl" id="charLvl"></span></span>
        <span class="char-meta" id="charMeta"></span>
        <span class="meter"><span class="meter-label">XP</span><span class="bar"><span class="fill xp" id="xpFill"></span></span><span class="meter-val" id="xpText"></span></span>
        <span class="meter" title="Integrity — your last 7 days"><span class="meter-label">HP</span><span class="bar"><span class="fill hp" id="hpFill"></span></span><span class="meter-val" id="hpText"></span></span>
      </span>
      <span class="char-chev" data-icon="right"></span>
    </button>
  </section>

  <form class="add-form" id="addForm" autocomplete="off">
    <input type="text" id="habitInput" placeholder="Add a new habit" maxlength="80" aria-label="New habit name" enterkeyhint="done">
    <button type="submit" class="add-btn" aria-label="Add habit" data-icon="plus"></button>
  </form>

  <div class="habits-list" id="habitsList"></div>

  <section class="backup-card">
    <div class="backup-icon" data-icon="download"></div>
    <div class="backup-text">
      <strong>Last backup</strong>
      <span id="backupStatus"></span>
    </div>
    <div class="backup-actions">
      <button class="btn btn-tonal" id="exportBtn" aria-label="Export data">Export</button>
      <button class="btn btn-tonal" id="importBtn" aria-label="Import data">Import</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json">
  </section>
</div>

<div class="shield" id="privacyShield" aria-label="Hidden — tap to show">
  <div class="shield-hint">
    <span data-icon="eye"></span>
    <span>Tap to show</span>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="dialog settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h3 id="settingsTitle">Settings</h3>
    <div class="setting-group">
      <div class="setting-row" id="gameRow">
        <div class="setting-label">Game mode
          <small>XP, levels, attributes and badges.</small>
        </div>
        <label class="switch">
          <input type="checkbox" id="gameToggle" aria-label="Game mode">
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row game">
        <div class="setting-label">Runner name</div>
        <input type="text" id="handleInput" class="setting-input" maxlength="24" placeholder="Runner" autocomplete="off" enterkeyhint="done">
      </div>
      <div class="setting-row">
        <div class="setting-label">Last backup
          <small>Export regularly — the file is your real backup.</small>
        </div>
        <span class="setting-value" id="lastExportInfo"></span>
      </div>
      <div class="setting-row">
        <div class="setting-label">Storage</div>
        <span class="setting-value" id="persistInfo"></span>
      </div>
    </div>
    <button class="btn btn-ghost" id="undoImportBtn" hidden>Undo last import</button>
    <button class="btn btn-primary" id="settingsClose">Done</button>
  </div>
</div>

<div class="overlay" id="charOverlay">
  <div class="dialog char-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName">
    <div class="sheet-head">
      <span class="char-avatar" id="sheetAvatar"></span>
      <div>
        <span class="sheet-title"><strong id="sheetName"></strong><span class="char-lvl" id="sheetLvl"></span></span>
        <span class="char-meta" id="sheetMeta"></span>
        <span class="sheet-line" id="sheetPet"></span>
        <span class="sheet-line" id="sheetNext"></span>
      </div>
    </div>
    <div class="view-toggle sheet-tabs" id="sheetTabs">
      <button data-tab="stats" class="active">Stats</button>
      <button data-tab="badges">Badges</button>
      <button data-tab="records">Records</button>
      <button data-tab="look" id="lookTab">Look</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <button class="btn btn-primary" id="charClose">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="confirmOverlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle">Delete habit?</h3>
    <p id="confirmMsg">This cannot be undone.</p>
    <div class="btn-row">
      <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
      <button class="btn btn-danger" id="confirmOk">Delete</button>
    </div>
  </div>
</div>

<script src="./game.js"></script>
<script src="./avatar.js"></script>
<script>
/* ─────────────────────────────────────
   Habit Tracker — single-file PWA
   ───────────────────────────────────── */

// ── DOM refs ──
const $ = (s) => document.querySelector(s);

const habitsList  = $('#habitsList');
const addForm     = $('#addForm');
const habitInput  = $('#habitInput');
const headerDate  = $('#headerDate');
const toastEl     = $('#toast');
const overlay     = $('#confirmOverlay');
const confirmTitle= $('#confirmTitle');
const confirmMsg  = $('#confirmMsg');
const confirmOk   = $('#confirmOk');
const confirmCancel = $('#confirmCancel');
const exportBtn   = $('#exportBtn');
const importBtn   = $('#importBtn');
const importFile  = $('#importFile');
const themeBtn    = $('#themeBtn');
const hideBtn     = $('#hideBtn');
const shield      = $('#privacyShield');
const settingsBtn = $('#settingsBtn');
const settingsOverlay = $('#settingsOverlay');
const settingsClose = $('#settingsClose');
const lastExportInfo = $('#lastExportInfo');
const persistInfo = $('#persistInfo');
const undoImportBtn = $('#undoImportBtn');
const summaryEl   = $('#summary');
const ringBar     = $('#ringBar');
const summaryTitle = $('#summaryTitle');
const summarySub  = $('#summarySub');
const backupStatus = $('#backupStatus');
const RING_C = 2 * Math.PI * 19; // circumference of the progress ring
const charBlock   = $('#charBlock');
const charAvatar  = $('#charAvatar');
const charName    = $('#charName');
const charLvl     = $('#charLvl');
const charMeta    = $('#charMeta');
const xpFill      = $('#xpFill');
const xpText      = $('#xpText');
const hpFill      = $('#hpFill');
const hpText      = $('#hpText');
const charOverlay = $('#charOverlay');
const sheetAvatar = $('#sheetAvatar');
const sheetName   = $('#sheetName');
const sheetMeta   = $('#sheetMeta');
const sheetLvl    = $('#sheetLvl');
const sheetPet    = $('#sheetPet');
const sheetNext   = $('#sheetNext');
const lookTab     = $('#lookTab');
const sheetTabs   = $('#sheetTabs');
const sheetBody   = $('#sheetBody');
const charClose   = $('#charClose');
const gameRow     = $('#gameRow');
const gameToggle  = $('#gameToggle');
const handleInput = $('#handleInput');

// ── Icons (inline SVG, 24×24 line style) ──
const ICONS = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="M9.9 9.9a3 3 0 1 0 4.2 4.2"/><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-1.7 2.7"/><path d="M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M2 2l20 20"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  more: '<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>',
  grip: '<circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/>',
  flame: '<path d="M12 2c1 3.5 5 5.8 5 11a5 5 0 0 1-10 0c0-2.4 1.1-4 2.4-5.2.2 1.7 1 2.9 2.1 3.4C11 9 10.8 5.3 12 2z"/>',
  left: '<path d="M15 18l-6-6 6-6"/>',
  right: '<path d="M9 18l6-6-6-6"/>',

const SOLID_ICONS = new Set(['more', 'grip', 'flame']);

function icon(name) {
  return `<svg class="i${SOLID_ICONS.has(name) ? ' solid' : ''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
}

// ── State ──
const STORAGE_KEY = 'habits_v1';
// Safety copies — written next to the main key, never read automatically.
const SNAPSHOT_KEY  = 'habits_v1_backup_pre_v2';  // raw data as found on first launch of this version
const PREIMPORT_KEY = 'habits_v1_preimport';      // state right before the last import
const UNREADABLE_KEY = 'habits_v1_unreadable';    // raw data we could not parse (suffixed by date)
const BACKUP_NUDGE_DAYS = 14;
let state = { version: 1, habits: [], settings: {} };
let confirmResolve = null;

// Settings live inside the same JSON blob (still version 1 — older
// backups without `settings` are fine, they get the defaults).
function ensureSettings() {
  if (!state.settings || typeof state.settings !== 'object') state.settings = {};
}

// ── Helpers ──
// YYYY-MM-DD in local time (per spec: never store timestamps)
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const today = () => fmtDate(new Date());

function dateAdd(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return fmtDate(d);
}

function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

// Escape anything from state before it goes into innerHTML.
function esc(v) {
  return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function newId() {
  // crypto.randomUUID() is supported in all modern browsers
  const id = crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10);
  return 'h_' + id;
}

function dayName(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short' }).slice(0, 2).toUpperCase();
}

// ── Streak ──
// Consecutive completed days counting back from today. Today not being done
// yet doesn't break the streak — yesterday counts as the starting point.
function calcStreak(completed) {
  const set = new Set(completed);
  let t = today();
  // If today is not completed, check if yesterday is; if not, streak is 0.
  if (!set.has(t)) {
    t = dateAdd(t, -1);
    if (!set.has(t)) return 0;
  }
  let count = 0;
  while (set.has(t)) {
    count++;
    t = dateAdd(t, -1);
  }
  return count;
}

// ── Persistence ──
// Loading is strictly non-destructive: nothing is written back here, and
// missing fields are only filled in memory (they get saved with the next
// real change). Data we can't read is copied aside before the app starts empty.
function loadState() {
  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return; }
  if (!raw) return;

  // One-time copy of the data exactly as this app version first found it.
  try {
    if (localStorage.getItem(SNAPSHOT_KEY) === null) localStorage.setItem(SNAPSHOT_KEY, raw);
  } catch (e) { /* storage full — not fatal, the main key is untouched */ }

  let parsed = null;
  try { parsed = JSON.parse(raw); } catch (e) { /* handled below */ }
  const migrated = migrate(parsed);
  if (migrated) {
    state = migrated;
    ensureSettings();
    state.habits.forEach(h => { if (!Array.isArray(h.completed)) h.completed = []; });
    return;
  }

  // Unreadable or from a newer app version: keep a copy so the next save
  // can't destroy it, then start empty.
  stashUnreadable(raw);
  setTimeout(() => toast('Saved data could not be read — a copy was kept. Import a backup.'), 300);
}

// Bring older data shapes up to the current version. Returns null for
// anything this version doesn't understand (including newer versions).
function migrate(data) {
  if (!data || typeof data !== 'object' || !Array.isArray(data.habits)) return null;
  if (data.version === 1) return data;
  return null;
}

function stashUnreadable(raw) {
  try {
    for (let n = 1; n < 100; n++) {
      const key = `${UNREADABLE_KEY}_${today()}${n > 1 ? '_' + n : ''}`;
      const existing = localStorage.getItem(key);
      if (existing === raw) return;
      if (existing === null) { localStorage.setItem(key, raw); return; }
    }
  } catch (e) { /* nothing more we can do */ }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    toast('Could not save — storage full?');
  }
}

function persistStorage() {
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then(granted => {
      if (!granted) console.warn('Storage persist denied — export your data regularly.');
    }).catch(() => {});
  }
}

// ── Export / Import ──
async function exportData() {
  const file = new File([JSON.stringify(state, null, 2)], `habits-backup-${today()}.json`, { type: 'application/json' });

  // On the phone the share sheet ("Save to Files", AirDrop, …) is far more
  // reliable than a download link, especially in a Home Screen app.
  const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      markExported();
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // user closed the share sheet
      // anything else — fall through to the download link
    }
  }

  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Revoking right away can cancel the download in WebKit.
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  markExported();
}

function markExported() {
  state.settings.lastExport = today();
  saveState();
  updateBackupStatus();
  toast('Exported!');
}

// Strict cleanup for imported files only (never applied on load): keeps
// valid habits, dedupes/sorts dates, and preserves any unknown fields.
function normalizeImport(data) {
  const migrated = migrate(data);
  if (!migrated) return null;
  const seen = new Set();
  const habits = [];
  for (const h of migrated.habits) {
    if (!h || typeof h !== 'object' || typeof h.name !== 'string' || !h.name.trim()) continue;
    let id = typeof h.id === 'string' && h.id ? h.id : newId();
    while (seen.has(id)) id = newId();
    seen.add(id);
    const completed = Array.isArray(h.completed)
      ? [...new Set(h.completed.filter(d => typeof d === 'string' && DATE_RE.test(d)))].sort()
      : [];
    const createdAt = typeof h.createdAt === 'string' && DATE_RE.test(h.createdAt) ? h.createdAt : today();
    habits.push({ ...h, id, createdAt, completed });
  }
  return { ...migrated, habits };
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}

async function importData(file) {
  let data;
  try {
    data = normalizeImport(JSON.parse(await readFile(file)));
  } catch (e) { data = null; }
  if (!data) { toast('Invalid file.'); return; }

  const cur = state.habits.length, inc = data.habits.length;
  const ok = await confirm('Import backup?',
    `This replaces your ${cur} habit${cur === 1 ? '' : 's'} with ${inc} from the file. ` +
    'You can undo this in Settings.', 'Import');
  if (!ok) return;

  try {
    localStorage.setItem(PREIMPORT_KEY, JSON.stringify(state));
  } catch (e) {
    toast('Could not save a safety copy — import cancelled.');
    return;
  }
  applyImportedState(data);
  toast('Imported!');
}

function applyImportedState(data) {
  state = data;
  ensureSettings();
  saveState();
  render();
  syncSettingsUI();
}

async function undoImport() {
  let prev = null;
  try { prev = migrate(JSON.parse(localStorage.getItem(PREIMPORT_KEY))); } catch (e) {}
  if (!prev) { toast('Nothing to undo.'); return; }
  const ok = await confirm('Undo last import?',
    `This restores the ${prev.habits.length} habit${prev.habits.length === 1 ? '' : 's'} you had before importing.`, 'Restore');
  if (!ok) return;
  applyImportedState(prev);
  try { localStorage.removeItem(PREIMPORT_KEY); } catch (e) {}
  syncSettingsUI();
  toast('Restored.');
}

// ── Confirm dialog ──
function confirm(title, msg, okLabel = 'Delete') {
  return new Promise(resolve => {
    confirmTitle.textContent = title;
    confirmMsg.textContent = msg;
    confirmOk.textContent = okLabel;
    confirmResolve = resolve;
    overlay.classList.add('open');
  });
}

function closeConfirm(result) {
  overlay.classList.remove('open');
  if (confirmResolve) { confirmResolve(result); confirmResolve = null; }
}

confirmOk.addEventListener('click', () => closeConfirm(true));
confirmCancel.addEventListener('click', () => closeConfirm(false));
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeConfirm(false); });

// ── Toast ──
// Messages queue up instead of replacing each other (a check-off can
// trigger a crit, a badge and a perfect day at once).
let toastTimer;
const toastQueue = [];
function toast(msg) {
  if (toastEl.classList.contains('show')) {
    if (toastQueue.length < 4) toastQueue.push(msg);
    return;
  }
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.classList.remove('show');
    if (toastQueue.length) setTimeout(() => toast(toastQueue.shift()), 300);
  }, 2200);
}

// ── View state (per habit, in memory only) ──
const viewMode   = new Map();  // habitId → 'week' | 'month'
const monthOffset = new Map(); // habitId → number (0 = current month)

function getViewMode(habitId) {
  return viewMode.get(habitId) || 'week';
}
function getMonthOffset(habitId) {
  return monthOffset.get(habitId) || 0;
}

// ── Calendar helpers ──
function monthYearLabel(offset) {
  // Day 1 of the target month — setMonth() on today's date overflows on the 29th–31st.
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
  return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

function buildCalendar(offset) {
  const now = new Date();
  const year  = now.getFullYear();
  const month = now.getMonth() + offset;

  const firstDay = new Date(year, month, 1);
  const lastDay  = new Date(year, month + 1, 0);
  const totalDays = lastDay.getDate();
  const startDow = (firstDay.getDay() + 6) % 7; // 0 = Monday

  const cells = [];
  // Leading empty cells
  for (let i = 0; i < startDow; i++) {
    cells.push({ date: null, empty: true });
  }
  // Day cells
  for (let d = 1; d <= totalDays; d++) {
    const dateStr = fmtDate(new Date(year, month, d));
    cells.push({ date: dateStr, empty: false, dayNum: d });
  }

  return { year, month, cells, startDow, totalDays };
}

// ── Render ──
// Per-card "⋯" menu state (in memory only, like the view mode)
const expanded = new Set();
// The cell that was just toggled — gets a little pop animation once
let justToggled = null;

function renderSummary() {
  const n = state.habits.length;
  summaryEl.hidden = n === 0;
  if (n === 0) return;
  const t = today();
  const done = state.habits.filter(h => h.completed.includes(t)).length;
  ringBar.style.strokeDashoffset = RING_C * (1 - done / n);
  summaryTitle.textContent = done === n ? 'All done today' : `${done} of ${n} done today`;
  summarySub.textContent = done === n ? 'Nice work — every habit checked off.'
    : `${n - done} habit${n - done === 1 ? '' : 's'} left`;
}

function render() {
  headerDate.textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric'
  });
  document.body.classList.toggle('no-game', !gameOn());
  progress = window.Game ? window.Game.computeProgress(state, today()) : null;
  renderSummary();
  renderCharacter();
  updateBackupStatus();

  if (state.habits.length === 0) {
    habitsList.innerHTML = `<div class="empty-state">
      <div class="empty-icon">${icon('target')}</div>
      <strong>No habits yet</strong>
      <p>Add your first habit above to start a streak.</p>
    </div>`;
    return;
  }

  const isToday = today();
  const popKey = justToggled;
  justToggled = null;

  habitsList.innerHTML = state.habits.map(h => {
    const hid = esc(h.id);
    const completedSet = new Set(h.completed);
    const streak = calcStreak(h.completed);
    const mode = getViewMode(h.id);
    const offset = getMonthOffset(h.id);
    const open = expanded.has(h.id);
    const doneToday = completedSet.has(isToday);
    const pops = date => popKey === `${h.id}|${date}` && completedSet.has(date);
    const best = progress && progress.perHabit[h.id] ? progress.perHabit[h.id].best : 0;
    const isPB = best >= 3 && streak === best;
    const stat = window.Game && window.Game.STATS.includes(h.stat) ? h.stat : null;

    let bodyHtml;
    if (mode === 'month') {
      const cal = buildCalendar(offset);
      const headHtml = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su']
        .map(d => `<span class="cal-head">${d}</span>`).join('');
      const calCellsHtml = cal.cells.map(c => {
        if (c.empty) return '<span class="cal-cell empty"></span>';
        const done = completedSet.has(c.date);
        const isT = c.date === isToday;
        return `<button class="cal-cell${done ? ' done' : ''}${isT ? ' today' : ''}${pops(c.date) ? ' pop' : ''}"
          data-habit="${hid}" data-date="${c.date}"
          aria-label="${c.date}${done ? ' done' : ''}">${c.dayNum}</button>`;
      }).join('');

      bodyHtml = `
        <div class="month-nav">
          <button class="month-nav-btn" data-month-prev="${hid}" aria-label="Previous month">${icon('left')}</button>
          <span class="month-nav-label">${monthYearLabel(offset)}</span>
          <button class="month-nav-btn" data-month-next="${hid}" aria-label="Next month">${icon('right')}</button>
        </div>
        <div class="calendar">
          <div class="calendar-grid">${headHtml}${calCellsHtml}</div>
        </div>`;
    } else {
      // This week Monday–Sunday
      const dayOfWeek = (new Date().getDay() + 6) % 7; // 0=Mon
      const monday = dateAdd(isToday, -dayOfWeek);
      const days = [];
      for (let i = 0; i < 7; i++) {
        days.push(dateAdd(monday, i));
      }
      const dotsHtml = days.map(d => {
        const done = completedSet.has(d);
        const isT = d === isToday;
        return `<button class="day-dot${done ? ' done' : ''}${isT ? ' today' : ''}"
          data-habit="${hid}" data-date="${d}"
          aria-label="${d} ${done ? 'done' : 'not done'}${isT ? ' (today)' : ''}"
          title="${d}"><span class="dl">${dayName(d)}</span><span class="dn${pops(d) ? ' pop' : ''}">${Number(d.slice(8))}</span></button>`;
      }).join('');
      bodyHtml = `<div class="day-grid">${dotsHtml}</div>`;
    }

    const statPicker = window.Game ? `
        <div class="game stat-picker" role="group" aria-label="Attribute this habit trains">
          <span class="stat-picker-label">Trains</span>
          ${['', ...window.Game.STATS].map(s => `<button data-stat-habit="${hid}" data-stat="${s}"
            class="${(stat || '') === s ? 'active' : ''}"
            aria-label="${s ? window.Game.STAT_INFO[s].name : 'No attribute'}">${s || '—'}</button>`).join('')}
        </div>` : '';
    const actionsHtml = open ? `
      <div class="card-actions">${statPicker}
        <div class="view-toggle">
          <button data-view-week="${hid}" class="${mode === 'week' ? 'active' : ''}" aria-label="Week view">Week</button>
          <button data-view-month="${hid}" class="${mode === 'month' ? 'active' : ''}" aria-label="Month view">Month</button>
        </div>
        <span class="spacer"></span>
        <div class="reorder-btns">
          <button class="mini-btn" data-move-up="${hid}" aria-label="Move up">${icon('up')}</button>
          <button class="mini-btn" data-move-down="${hid}" aria-label="Move down">${icon('down')}</button>
        </div>
        <button class="mini-btn danger" data-delete="${hid}" aria-label="Delete habit">${icon('trash')}</button>
      </div>` : '';

    return `<div class="habit-card" id="card-${hid}">
      <div class="habit-row">
        <span class="drag-handle" data-drag="${hid}" aria-label="Drag to reorder">${icon('grip')}</span>
        <div class="habit-info">
          <span class="habit-name" title="${esc(h.name)}">${esc(h.name)}</span>
          <span class="habit-meta">
            <span class="habit-streak${streak === 0 ? ' zero' : ''}">${icon('flame')}${
              streak === 0 ? 'No streak yet' : `${streak} day${streak === 1 ? '' : 's'}`}</span>
            ${isPB ? '<span class="game pb" title="Personal best">PB</span>'
              : best > 0 ? `<span class="game best">Best ${best}</span>` : ''}
            ${stat ? `<span class="game stat-chip" title="${window.Game.STAT_INFO[stat].name}">${stat}</span>` : ''}
          </span>
        </div>
        <button class="more-btn" data-more="${hid}" aria-label="More options" aria-expanded="${open}">${icon('more')}</button>
        <button class="check-btn${doneToday ? ' done' : ''}${pops(isToday) ? ' pop' : ''}"
          data-habit="${hid}" data-date="${isToday}" aria-pressed="${doneToday}"
          aria-label="${doneToday ? 'Done today — tap to undo' : 'Mark done today'}">${icon('check')}</button>
      </div>
      ${bodyHtml}
      ${actionsHtml}
    </div>`;
  }).join('');

  // Attach events
  habitsList.querySelectorAll('.day-dot, .cal-cell, .check-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleDay(btn.dataset.habit, btn.dataset.date, btn));
  });
  habitsList.querySelectorAll('[data-stat-habit]').forEach(btn => {
    btn.addEventListener('click', () => setHabitStat(btn.dataset.statHabit, btn.dataset.stat));
  });
  habitsList.querySelectorAll('[data-more]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.more;
      if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
      render();
    });
  });
  habitsList.querySelectorAll('[data-month-prev]').forEach(btn => {
    btn.addEventListener('click', () => {
      const hid = btn.dataset.monthPrev;
      monthOffset.set(hid, getMonthOffset(hid) - 1);
      render();
    });
  });
  habitsList.querySelectorAll('[data-month-next]').forEach(btn => {
    btn.addEventListener('click', () => {
      const hid = btn.dataset.monthNext;
      monthOffset.set(hid, getMonthOffset(hid) + 1);
      render();
    });
  });
  habitsList.querySelectorAll('[data-view-week]').forEach(btn => {
    btn.addEventListener('click', () => {
      viewMode.set(btn.dataset.viewWeek, 'week');
      render();
    });
  });
  habitsList.querySelectorAll('[data-view-month]').forEach(btn => {
    btn.addEventListener('click', () => {
      viewMode.set(btn.dataset.viewMonth, 'month');
      render();
    });
  });
  habitsList.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', () => deleteHabit(btn.dataset.delete));
  });
  habitsList.querySelectorAll('[data-move-up]').forEach(btn => {
    btn.addEventListener('click', () => moveHabit(btn.dataset.moveUp, -1));
  });
  habitsList.querySelectorAll('[data-move-down]').forEach(btn => {
    btn.addEventListener('click', () => moveHabit(btn.dataset.moveDown, 1));
  });
}

// ── Drag-and-drop reorder ──
// Live-swap drag: the card swaps places with its neighbours while the
// pointer crosses their midlines. On release, the final order is read
// straight from the DOM — no index math to get wrong.
let dragState = null; // { el, pointerId }

habitsList.addEventListener('pointerdown', e => {
  if (dragState) return;
  const handle = e.target.closest('.drag-handle');
  if (!handle) return;
  const card = handle.closest('.habit-card');
  if (!card) return;

  // WebKit throws for touch pointers in some versions — drag must not die on this.
  try { card.setPointerCapture(e.pointerId); } catch (err) {}
  dragState = { el: card, pointerId: e.pointerId };
  card.classList.add('dragging');
  e.preventDefault();
});

habitsList.addEventListener('pointermove', e => {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  const el = dragState.el;
  const y = e.clientY;
  e.preventDefault();

  // Auto-scroll near the viewport edges so long lists can be reordered
  if (y < 70 && window.scrollY > 0) {
    window.scrollBy(0, -12);
  } else if (y > window.innerHeight - 70) {
    window.scrollBy(0, 12);
  }

  const next = el.nextElementSibling;
  if (next && next.classList.contains('habit-card')) {
    const r = next.getBoundingClientRect();
    // insert el after next (moves the dragged card down past it)
    if (y > r.top + r.height / 2) { next.after(el); return; }
  }
  const prev = el.previousElementSibling;
  if (prev && prev.classList.contains('habit-card')) {
    const r = prev.getBoundingClientRect();
    // insert el before prev (moves the dragged card up past it)
    if (y < r.top + r.height / 2) { prev.before(el); }
  }
});

function endDrag() {
  if (!dragState) return;
  try { dragState.el.releasePointerCapture(dragState.pointerId); } catch (err) {}
  dragState.el.classList.remove('dragging');
  dragState = null;

  // Final order = current DOM order of the cards
  const order = [...habitsList.querySelectorAll('.habit-card')].map(c => c.id.replace('card-', ''));
  const byId = new Map(state.habits.map(h => [h.id, h]));
  const reordered = order.map(id => byId.get(id)).filter(Boolean);
  if (reordered.length === state.habits.length &&
      reordered.some((h, i) => h !== state.habits[i])) {
    state.habits = reordered;
    saveState();
    render();
  }
}

habitsList.addEventListener('pointerup', endDrag);
habitsList.addEventListener('pointercancel', endDrag);
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

// ▲▼ buttons — guaranteed fallback if drag is ever unavailable
function moveHabit(habitId, dir) {
  const i = state.habits.findIndex(h => h.id === habitId);
  const j = i + dir;
  if (i === -1 || j < 0 || j >= state.habits.length) return;
  const [item] = state.habits.splice(i, 1);
  state.habits.splice(j, 0, item);
  saveState();
  render();
}

// ── Actions ──
function addHabit(name) {
  name = name.trim();
  if (!name) return;
  state.habits.push({
    id: newId(),
    name,
    createdAt: today(),
    completed: []
  });
  saveState();
  render();
}

function toggleDay(habitId, dateStr, srcEl) {
  const habit = state.habits.find(h => h.id === habitId);
  if (!habit) return;
  const idx = habit.completed.indexOf(dateStr);
  const before = progress;
  const rect = srcEl ? srcEl.getBoundingClientRect() : null;
  justToggled = `${habitId}|${dateStr}`;
  if (idx > -1) {
    habit.completed.splice(idx, 1);
  } else {
    habit.completed.push(dateStr);
    habit.completed.sort();
  }
  saveState();
  render();
  // Celebrate only real transitions caused by this tap — never on load.
  if (idx === -1 && gameOn() && before && progress) celebrate(before, progress, habitId, dateStr, rect);
}

function setHabitStat(habitId, stat) {
  const habit = state.habits.find(h => h.id === habitId);
  if (!habit) return;
  if (stat) habit.stat = stat; else delete habit.stat;
  saveState();
  render();
}

async function deleteHabit(habitId) {
  const habit = state.habits.find(h => h.id === habitId);
  if (!habit) return;
  const ok = await confirm('Delete habit?', `"${habit.name}" will be permanently removed.`);
  if (!ok) return;
  state.habits = state.habits.filter(h => h.id !== habitId);
  saveState();
  render();
  toast(`Deleted "${habit.name}"`);
}

// ── Theme ──
const THEME_KEY = 'theme';

function getTheme() {
  const stored = localStorage.getItem(THEME_KEY);
  if (stored === 'dark' || stored === 'light') return stored;
  // No stored preference — check system
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
  return 'light';
}

function applyTheme(theme) {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (theme === 'dark') {
    document.documentElement.dataset.theme = 'dark';
    themeBtn.innerHTML = icon('moon');
    if (meta) meta.content = '#000000';
  } else {
    delete document.documentElement.dataset.theme;
    themeBtn.innerHTML = icon('sun');
    if (meta) meta.content = '#f2f2f7';
  }
}

function toggleTheme() {
  const current = getTheme();
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}

// Listen for system theme changes (only applies when no manual override)
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!localStorage.getItem(THEME_KEY)) {
      applyTheme(getTheme());
    }
  });
}

// ── Game layer (derived from check-offs — see game.js) ──
let progress = null;   // result of Game.computeProgress for the current state
let sheetTab = 'stats';

const gameOn = () => !!window.Game && state.settings.gamify !== false;
const handle = () => (typeof state.settings.handle === 'string' && state.settings.handle.trim()) || 'Runner';
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const signed = n => (n >= 0 ? `+${n}` : `${n}`);

function shortDate(d) {
  const opts = { month: 'short', day: 'numeric' };
  if (d.slice(0, 4) !== today().slice(0, 4)) opts.year = 'numeric';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-US', opts);
}

// ── Avatar (avatar.js) — derived from level + today's condition ──
function avatarLook() {
  return window.Avatar ? window.Avatar.normalize(state.settings.avatar) : null;
}

function avatarHtml(p) {
  const A = window.Avatar, look = avatarLook(), c = A.condition(p);
  return A.runner({ level: p.level, ...look, mood: c.mood })
    + `<span class="av-pet">${A.pet({ level: p.level, ...look, mood: c.petMood })}</span>`;
}

// Runner + pet if avatar.js loaded, otherwise the class icon.
function setAvatar(el, p) {
  if (window.Avatar) {
    el.className = 'av';
    el.innerHTML = avatarHtml(p);
  } else {
    el.className = 'char-avatar';
    el.innerHTML = icon(p.clsIcon);
  }
}

function evolutionHtml(p) {
  const A = window.Avatar;
  if (!A) return '';
  const nx = A.next(p.level);
  const look = avatarLook();
  const got = A.EVOLUTION.filter(e => e.level > 1 && e.level <= p.level).reverse();
  const pr = A.prestige(p.level);
  return `<h4 class="sheet-h">Evolution</h4>
    <div class="next-up">
      <span class="av">${A.runner({ level: nx.level, ...look })}<span class="av-pet">${A.pet({ level: nx.level, ...look })}</span></span>
      <div><strong>LVL ${nx.level} · ${esc(nx.label)}</strong><span>${nx.who === 'pet' ? `${esc(look.petName)} evolves` : 'Your runner upgrades'} at level ${nx.level}</span></div>
      <span class="lock-tag">LOCKED</span>
    </div>
    ${got.length || pr ? `<div class="ups">${pr ? `<span class="up"><b>LVL ${p.level}</b>Prestige ${pr}</span>` : ''}${got.map(e =>
      `<span class="up"><b>${e.level}</b>${esc(e.label)}</span>`).join('')}</div>` : ''}`;
}

function lookHtml(p) {
  const A = window.Avatar, look = avatarLook();
  const sw = (key, label) => `<h4 class="sheet-h">${label}</h4><div class="swatches">${
    Object.entries(A.PALETTES[key]).map(([k, hex]) =>
      `<button class="swatch${look[key] === k ? ' on' : ''}" data-look="${key}" data-val="${k}"
        style="background:${hex}" aria-label="${label} ${k}" aria-pressed="${look[key] === k}"></button>`).join('')}</div>`;
  return `<div class="look-preview"><span class="av">${avatarHtml(p)}</span></div>
    ${sw('skin', 'Skin')}${sw('hair', 'Hair')}${sw('neon', 'Neon')}
    <h4 class="sheet-h">Pet name</h4>
    <input type="text" class="setting-input look-name" id="petNameInput" maxlength="16"
      placeholder="${esc(A.DEFAULTS.petName)}" value="${esc(state.settings.avatar && state.settings.avatar.petName || '')}" autocomplete="off" enterkeyhint="done">`;
}

function setLook(key, val) {
  const cur = (state.settings.avatar && typeof state.settings.avatar === 'object') ? state.settings.avatar : {};
  const next = { ...cur, [key]: val };
  if (key === 'petName' && !val) delete next.petName;
  state.settings.avatar = next;
  saveState();
  render();
}

sheetBody.addEventListener('click', e => {
  const b = e.target.closest('[data-look]');
  if (b) setLook(b.dataset.look, b.dataset.val);
});
sheetBody.addEventListener('change', e => {
  if (e.target.id === 'petNameInput') setLook('petName', e.target.value.trim().slice(0, 16));
});

function renderCharacter() {
  if (!progress || !gameOn()) return;
  const p = progress;
  setAvatar(charAvatar, p);
  charName.textContent = handle();
  charLvl.textContent = `LVL ${p.level}`;
  charMeta.textContent = `${p.rank} · ${p.cls}`;
  xpFill.style.width = `${(100 * p.levelXp / p.nextXp).toFixed(1)}%`;
  xpText.textContent = `${p.levelXp} / ${p.nextXp}`;
  hpFill.style.width = `${p.integrity}%`;
  hpText.textContent = p.integrity < 30 ? `⚠ ${p.integrity}%` : `${p.integrity}%`;
  hpText.classList.toggle('warn', p.integrity < 30);
  if (charOverlay.classList.contains('open')) renderSheet();
}

function renderSheet() {
  const p = progress;
  if (!p) return;
  const A = window.Avatar;
  if (!A && sheetTab === 'look') sheetTab = 'stats';
  setAvatar(sheetAvatar, p);
  sheetName.textContent = handle();
  sheetMeta.textContent = `${p.rank} · ${p.cls}`;
  sheetLvl.textContent = `LVL ${p.level}`;
  lookTab.hidden = !A;
  sheetPet.hidden = sheetNext.hidden = !A;
  if (A) {
    const nx = A.next(p.level);
    sheetPet.innerHTML = `<b>${esc(avatarLook().petName)}</b> · ${A.PET_FORM_NAMES[A.petForm(p.level)]}`;
    sheetNext.innerHTML = `Next: <b>LVL ${nx.level}</b> · ${esc(nx.label)}`;
  }
  sheetTabs.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.tab === sheetTab));
  sheetBody.innerHTML = sheetTab === 'badges' ? badgesHtml(p)
    : sheetTab === 'records' ? recordsHtml(p)
    : sheetTab === 'look' ? lookHtml(p)
    : statsHtml(p);
}

function statsHtml(p) {
  const G = window.Game;
  const rows = G.STATS.map(s => {
    const st = p.stats[s], info = G.STAT_INFO[s];
    return `<div class="attr${s === p.topStat ? ' top' : ''}">
      <span class="attr-code">${s}</span>
      <span class="attr-main">
        <strong>${info.name} <em>· ${info.cls}</em></strong>
        <span>${info.hint}</span>
        <span class="bar"><span class="fill xp" style="width:${(100 * st.score / 20).toFixed(0)}%"></span></span>
      </span>
      <span class="attr-score">${st.score}<em>${signed(st.mod)}</em></span>
    </div>`;
  }).join('');
  return `
    <div class="meters">
      <div class="meter"><span class="meter-label">XP</span><span class="bar"><span class="fill xp" style="width:${(100 * p.levelXp / p.nextXp).toFixed(1)}%"></span></span><span class="meter-val">${p.levelXp} / ${p.nextXp}</span></div>
      <div class="meter"><span class="meter-label">HP</span><span class="bar"><span class="fill hp" style="width:${p.integrity}%"></span></span><span class="meter-val${p.integrity < 30 ? ' warn' : ''}">${p.integrity}%</span></div>
    </div>
    <p class="sheet-note">${p.xp.toLocaleString('en-US')} XP total. HP is your Integrity — how much of the last 7 days you kept.
      ${p.integrity < 30 ? '<span class="hp-warn">⚠ Cyberpsychosis risk.</span>' : ''}</p>
    ${evolutionHtml(p)}
    <h4 class="sheet-h">Attributes</h4>
    <div class="attrs">${rows}</div>
    <p class="sheet-note">Your class comes from your highest attribute. Tap ⋯ on a habit to choose which attribute it trains.
      Each check-off: 10 XP, +2 per streak day (max +10), ×2 on a natural 20, +25 for a perfect day.</p>`;
}

function badgesHtml(p) {
  const n = p.achievements.filter(a => a.unlockedOn).length;
  return `<p class="sheet-note" style="margin:0 0 10px">${n} of ${p.achievements.length} unlocked</p>
    <div class="badges">${p.achievements.map(a => `
      <div class="badge${a.unlockedOn ? ' on' : ''}">
        <span class="badge-icon">${icon(a.icon)}</span>
        <strong>${a.name}</strong>
        <span>${a.desc}</span>
        <em>${a.unlockedOn ? shortDate(a.unlockedOn) : 'Locked'}</em>
      </div>`).join('')}
    </div>`;
}

function recordsHtml(p) {
  const t = today();
  const dow = (new Date(t + 'T00:00:00').getDay() + 6) % 7; // 0 = Monday
  const start = dateAdd(t, -dow - 15 * 7);                    // 16 weeks, Monday-start columns
  let cells = '';
  for (let i = 0; i < 16 * 7; i++) {
    const d = dateAdd(start, i);
    if (d > t) { cells += '<span class="hm future"></span>'; continue; }
    const s = p.dayStats.get(d);
    const r = s && s.active ? s.done / s.active : 0;
    const lv = r === 0 ? 0 : r < 0.34 ? 1 : r < 0.67 ? 2 : r < 1 ? 3 : 4;
    cells += `<span class="hm l${lv}" title="${d}"></span>`;
  }
  const tiles = [[p.checks, 'Check-offs'], [p.perfectDays.size, 'Perfect days'], [p.critDays.size, 'Natural 20s'], [`${p.rate30}%`, 'Last 30 days']];
  const rows = state.habits
    .map(h => ({ name: h.name, best: p.perHabit[h.id] ? p.perHabit[h.id].best : 0, cur: calcStreak(h.completed) }))
    .sort((a, b) => b.best - a.best);
  return `<div class="tiles">${tiles.map(([v, l]) => `<div class="tile"><strong>${v}</strong><span>${l}</span></div>`).join('')}</div>
    <h4 class="sheet-h">Last 16 weeks</h4>
    <div class="heatmap">${cells}</div>
    <h4 class="sheet-h">Best streaks</h4>
    <div class="records">${rows.map(r => `<div class="rec"><span>${esc(r.name)}</span><em>${r.cur ? `now ${r.cur}` : ''}</em><strong>${r.best}</strong></div>`).join('')}</div>`;
}

// ── Celebrations — compare progress before/after a check-off ──
function celebrate(before, after, habitId, date, rect) {
  const key = `${habitId}|${date}`;
  const crit = after.critDays.has(key) && !before.critDays.has(key);
  const perfect = after.perfectDays.has(date) && !before.perfectDays.has(date);
  const leveled = after.level > before.level;
  const gained = after.xp - before.xp;

  if (gained > 0 && rect && !reduceMotion()) floatText(`+${gained} XP`, rect, crit);
  if (leveled) showLevelUp(after, before);
  if ((perfect || leveled) && !reduceMotion()) confetti();

  const msgs = [];
  if (crit) msgs.push('NAT 20 — critical hit! ×2 XP');
  if (perfect) msgs.push(date === today() ? 'FULL SYNC — every habit done today' : 'FULL SYNC — perfect day');
  after.achievements.forEach((a, i) => {
    if (a.unlockedOn && !before.achievements[i].unlockedOn && !(perfect && a.id === 'full_sync')) {
      msgs.push(`Badge unlocked: ${a.name}`);
    }
  });
  // Let the level-up screen finish before the toasts start.
  setTimeout(() => msgs.forEach(m => toast(m)), leveled ? 2800 : 0);
}

function floatText(text, rect, crit) {
  const el = document.createElement('div');
  el.className = `xp-float${crit ? ' crit' : ''}`;
  el.textContent = text;
  el.style.left = `${rect.left + rect.width / 2}px`;
  el.style.top = `${rect.top - 6}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function showLevelUp(p, before) {
  const A = window.Avatar;
  const el = document.createElement('div');
  el.className = 'levelup';
  el.setAttribute('role', 'alert');
  let ups = [];
  if (A) for (let l = (before ? before.level : p.level - 1) + 1; l <= p.level; l++) ups = ups.concat(A.newAt(l));
  const petName = A ? avatarLook().petName : '';
  el.innerHTML = `${A ? `<span class="av">${avatarHtml(p)}</span>` : ''}
    <span>LEVEL UP</span><strong>${p.level}</strong><em>${esc(p.rank)}</em>
    ${ups.length ? `<div class="ups">${ups.map(u => `<span class="up"><b>NEW</b>${
      u.who === 'pet' ? `${esc(petName)}: ` : ''}${esc(u.label)}</span>`).join('')}</div>` : ''}`;
  const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 300); };
  el.addEventListener('click', close);
  document.body.appendChild(el);
  setTimeout(close, ups.length ? 2600 : 1700);
}

function confetti() {
  const colors = ['#00e5f2', '#ff2a6d', '#fcee0a', '#7d7aff'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.style.left = `${Math.random() * 100}vw`;
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', `${(Math.random() - 0.5) * 160}px`);
    c.style.setProperty('--r', `${(Math.random() - 0.5) * 900}deg`);
    c.style.setProperty('--d', `${1.1 + Math.random() * 0.8}s`);
    c.style.setProperty('--delay', `${Math.random() * 0.25}s`);
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2300);
  }
}

// ── Settings dialog ──
function lastExportAge() {
  const last = state.settings.lastExport;
  const age = last ? daysBetween(last, today()) : null;
  const label = last == null ? 'Never'
    : age <= 0 ? 'Today'
    : age === 1 ? 'Yesterday'
    : `${age} days ago`;
  return { label, stale: last == null || age >= BACKUP_NUDGE_DAYS };
}

function updateBackupStatus() {
  const { label, stale } = lastExportAge();
  backupStatus.textContent = label;
  backupStatus.classList.toggle('warn', stale);
}

function syncSettingsUI() {
  gameRow.hidden = !window.Game;
  gameToggle.checked = gameOn();
  handleInput.value = typeof state.settings.handle === 'string' ? state.settings.handle : '';

  const { label, stale } = lastExportAge();
  lastExportInfo.textContent = label;
  lastExportInfo.classList.toggle('warn', stale);

  persistInfo.textContent = '…';
  if (navigator.storage && navigator.storage.persisted) {
    navigator.storage.persisted()
      .then(p => { persistInfo.textContent = p ? 'Protected' : 'Not protected'; })
      .catch(() => { persistInfo.textContent = 'Unknown'; });
  } else {
    persistInfo.textContent = 'Unknown';
  }

  let hasPreimport = false;
  try { hasPreimport = localStorage.getItem(PREIMPORT_KEY) !== null; } catch (e) {}
  undoImportBtn.hidden = !hasPreimport;
}

settingsBtn.addEventListener('click', () => {
  syncSettingsUI();
  settingsOverlay.classList.add('open');
});

settingsClose.addEventListener('click', () => settingsOverlay.classList.remove('open'));
undoImportBtn.addEventListener('click', () => {
  settingsOverlay.classList.remove('open');
  undoImport();
});
settingsOverlay.addEventListener('click', e => {
  if (e.target === settingsOverlay) settingsOverlay.classList.remove('open');
});

gameToggle.addEventListener('change', () => {
  state.settings.gamify = gameToggle.checked;
  saveState();

});

handleInput.addEventListener('change', () => {
  const v = handleInput.value.trim().slice(0, 24);

});

// ── Init ──
function init() {
  document.querySelectorAll('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon)));
  loadState();
  ensureSettings(); // also covers first launch (no stored state yet)
  applyTheme(getTheme());
  persistStorage();

  render();
  nudgeBackup();

  // Register service worker, then ask it to refresh the cached app files
  // (resilience: re-cache critical assets on every launch).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
    navigator.serviceWorker.ready
      .then(reg => { if (reg.active) reg.active.postMessage('recache'); })
      .catch(() => {});
  }
}

// Gentle reminder, at most once a day, when the last export is old.
function nudgeBackup() {
  if (state.habits.length === 0) return;
  const last = state.settings.lastExport;
  if (last && daysBetween(last, today()) < BACKUP_NUDGE_DAYS) return;
  try {
    if (localStorage.getItem('backup_nudge_day') === today()) return;
    localStorage.setItem('backup_nudge_day', today());
  } catch (e) { return; }
  setTimeout(() => toast(last ? `Last backup ${daysBetween(last, today())} days ago — tap Export` : 'Tip: tap Export to back up your data'), 1200);
}

// A Home Screen app resumes without reloading — refresh "today" when it
// comes back (e.g. after midnight) and renew the storage request.
let renderedDay = today();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  persistStorage();
  if (today() !== renderedDay && !dragState) {
    renderedDay = today();
    render();
  }
});

init();
</script>
</body>
</html>
